/* ---------------- utils ---------------- */
const TAU = Math.PI * 2;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ss01 = v => v <= 0 ? 0 : v >= 1 ? 1 : v * v * (3 - 2 * v);
function h3(x, y, z) {
  let n = ((x | 0) * 374761393 + (y | 0) * 668265263 + (z | 0) * 1440662683) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixHex(h, w) {
  const c = hexRGB(h);
  const r = Math.round(c[0] + (255 - c[0]) * w), g = Math.round(c[1] + (255 - c[1]) * w), b = Math.round(c[2] + (255 - c[2]) * w);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

  mar:'#6e1d3f', red:'#d93a36', org:'#ff7b2e', amb:'#ffb64d', gld:'#ffdf85', crm:'#fff4cc'
};
const PI = {};
PALN.forEach((n, i) => PI[n] = i);
const CORE = PALN.map(n => mixHex(PALV[n], 0.55));
const FILL = PALN.map(n => { const c = hexRGB(PALV[n]); return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; });

const RS = [
  [PI.mar, PI.red, PI.org, PI.amb, PI.gld, PI.crm, PI.wht],
  [PI.pdp, PI.mar, PI.red, PI.org, PI.amb, PI.gld, PI.crm],
  [PI.void, PI.pdp, PI.prp, PI.mag, PI.pnk, PI.ice, PI.wht],
  [PI.void, PI.dbl, PI.blu, PI.cyn, PI.ice, PI.wht, PI.wht]
];
function pickCol(u, hue, heat, gx, gy) {
  const rp = hue * (RS.length - 1);
  const ri = Math.min(RS.length - 2, Math.floor(rp));
  const set = RS[h3(gx, gy, 911) < (rp - ri) ? ri + 1 : ri];
  let i = Math.floor(u * 4.4 + heat * 2.2);
  if (i < 0) i = 0; if (i > 6) i = 6;
  return set[i];
}

const rampChar = u => RAMP[Math.max(0, Math.min(9, Math.floor(u * 9.6)))];
const DIR4 = [CI['-'], CI['\\'], CI['|'], CI['/']];
const oppChar = c => c === CI['+'] ? CI['-'] : c === CI['-'] ? CI['+'] : c;

const SP = 34, FS = 22;
const S = [];
(function buildAtlas() {
  for (let ci = 0; ci < PALN.length; ci++) {
    S[ci] = [];
    for (let chi = 0; chi < CHS.length; chi++) {
      const c = document.createElement('canvas');
      c.width = c.height = SP;
      const g = c.getContext('2d');
      g.font = '700 ' + FS + 'px Menlo, Consolas, "Courier New", monospace';

      g.textBaseline = 'middle';
      g.shadowColor = PALV[PALN[ci]];
      g.shadowBlur = 8;
      g.fillStyle = PALV[PALN[ci]];
      g.fillText(CHS[chi], SP / 2, SP / 2);
      g.shadowBlur = 0;
      g.fillStyle = CORE[ci];
      g.fillText(CHS[chi], SP / 2, SP / 2);
      S[ci][chi] = c;
    }
  }
})();

let nxA = [], nyA = [];
let cellScale = 1;
function rebuildGrid() {
  const base = Math.max(11, Math.round(Math.min(W / 120, H / 66)));
  CELL = Math.round(base * cellScale);
  GX = Math.ceil(W / CELL);
  GY = Math.ceil(H / CELL);
  ASP = W / H;
  DS = CELL * 1.85;
  POF = (DS - CELL) / 2;
  nxA = new Array(GX); nyA = new Array(GY);
  for (let gx = 0; gx < GX; gx++) nxA[gx] = (((gx + 0.5) / GX) * 2 - 1) * ASP;
  for (let gy = 0; gy < GY; gy++) nyA[gy] = ((gy + 0.5) / GY) * 2 - 1;
}

  cvs.width = W; cvs.height = H;

/* ============================================================
   KERNELS — procedural ASCII field generators.
   out = {a:alpha, c:charIdx, col:palIdx, m:mirror}
   ============================================================ */
const OA = { a:0, c:0, col:0, m:0 }, OB = { a:0, c:0, col:0, m:0 };

function kVoid(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const q = Math.floor(t * (0.6 + p.rate * 2));
  const rr = h3(gx, gy, q);
  if (rr < p.dens * 0.05) {
    o.a = 0.15 + 0.6 * h3(gx, gy, q + 3);
    o.col = h3(gx, gy, q + 5) < 0.85 ? PI.dim : PI.cyn;
    o.c = h3(gx, gy, q + 7) < 0.6 ? CI['·'] : CI['.'];
  } else {
    const b = 0.011 * (0.5 + 0.5 * Math.sin(t * 0.5 + ny * 3 + nx));
    if (b > 0.004) { o.a = b; o.col = PI.void; o.c = CI['·']; }
  }
}

function kFoam(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const q = Math.floor(t * (5 + p.rate * 3));
  const rr = h3(gx, gy, q);
  if (rr < p.dens * 0.09) {
    const u = h3(gx, gy, q + 11);
    o.a = (0.25 + 0.75 * u) * p.glow;
    o.col = u < 0.72 ? PI.tea : u < 0.92 ? PI.cyn : PI.ice;
    o.c = rr < p.pair * 0.045 ? (u < 0.5 ? CI['+'] : CI['-'])
        : u < 0.3 ? CI['.'] : u < 0.6 ? CI['·'] : u < 0.85 ? CI[':'] : CI['+'];
    if (p.pair > 0.25 && rr < p.pair * 0.09) o.m = 1;
  }
}

function kSing(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const q = Math.floor(t * 22);
  nx += (h3(gx, gy, q) - 0.5) * p.jit * 0.06;
  ny += (h3(gx, gy, q + 1) - 0.5) * p.jit * 0.06;
  const r = Math.hypot(nx, ny) + 1e-5;
  const ang = Math.atan2(ny, nx);
  const fl = h3(gx, gy, q + 2);
  const R0 = 0.14 + 0.015 * Math.sin(t * 7.3);
  /* hyper-dense core : the shaking @ */
  const c1 = 0.045 * p.core, c2 = 0.1 * p.core, c3 = 0.18 * p.core;
  const hot = p.heat > 1.2;
  if (r < c3 && c3 > 0.006) {
    if (r < c1) { o.c = CI['@']; o.col = fl < 0.6 ? PI.wht : PI.crm; o.a = 1; }
    else if (r < c2) { o.c = fl < 0.5 ? CI['#'] : CI['%']; o.col = hot ? (fl < 0.5 ? PI.gld : PI.amb) : (fl < 0.5 ? PI.ice : PI.cyn); o.a = 0.88; }
    else { o.c = fl < 0.4 ? CI['*'] : CI['%']; o.col = hot ? (fl < 0.5 ? PI.org : PI.red) : (fl < 0.5 ? PI.mag : PI.pnk); o.a = 0.62; }
    o.a *= 0.75 + 0.25 * fl;
    return;
  }
  /* gravitational lensing rings + orbiting debris */
  const band = Math.exp(-Math.pow((r - R0) * 14, 2));
  const band2 = Math.exp(-Math.pow((r - R0 * 2 - 0.05) * 6, 2)) * (0.55 + 0.45 * Math.sin(ang * 9 - t * 3 * p.spin)) * p.spokes;
  const ao = ang - t * (0.4 / (r * 3 + 0.1));
  const db = h3(Math.floor(ao * 26 + 100), Math.floor(r * 24), 31);
  const uu = band + band2 * 0.7 + (db < 0.12 ? 0.5 * (0.3 + 0.7 * db / 0.12) : 0) * Math.exp(-r * 1.4) + Math.exp(-r * 2.2) * 0.1;
  if (uu < 0.045) return;
  o.a = Math.min(1, uu) * p.glow;
  o.col = r < R0 * 1.35 ? (uu > 0.7 ? PI.ice : PI.cyn) : (h3(gx, gy, 331) < 0.5 ? PI.prp : PI.mag);
  o.c = rampChar(Math.min(1, uu));
}

function kBang(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const r = Math.hypot(nx, ny) + 1e-5;
  const ang = Math.atan2(ny, nx) + p.flow * 0.15 * r;
  const R = p.spd * Math.pow(p.age, p.exp);
  const w = p.w;
  const a2 = ((ang % TAU) + TAU) % TAU;
  const sb = 0.45 + 0.55 * h3(Math.floor(a2 * 22), 5, Math.floor(t * 2.5));
  const inside = Math.exp(-r * 2.2 * p.cool) * p.fill;
  let sh = Math.exp(-Math.pow((r - R) / w, 2));
  sh += 0.55 * Math.exp(-Math.pow((r - R * 0.62) / (w * 0.7), 2));
  sh += 0.3 * Math.exp(-Math.pow((r - R * 0.4) / (w * 0.5), 2));
  const shellE = sh * sb * p.streak + sh * 0.3;
  const uu = Math.min(1, inside + shellE);
  if (uu < 0.05) return;
  o.a = uu * p.glow;
  o.col = pickCol(uu, p.hue, p.heat, gx, gy);
  o.c = shellE > inside ? DIR4[Math.round(a2 / (Math.PI / 4)) % 4] : rampChar(uu * 0.95);
}

function kPlasma(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const r = Math.hypot(nx, ny) + 1e-4;
  const sw = p.spin * 0.55 / (r + 0.32) + p.flow;
  const cs = Math.cos(sw), sn = Math.sin(sw);
  const x = (nx * cs - ny * sn) * p.zoom;
  const y = (nx * sn + ny * cs) * p.zoom;
  const T = t * p.speed;
  let v = Math.sin(x * 3.07 + T) + Math.sin(y * 2.71 - T * 1.31)
        + Math.sin((x + y) * 2.33 + T * 0.71) + Math.sin(Math.hypot(x, y) * 4.17 - T * 1.63);
  let u = v * 0.125 + 0.5;
  u += (h3(gx + Math.floor(T * 3), gy, 17) - 0.5) * p.grain * 0.3;
  u = clamp01(u);
  if (u < p.cut) return;
  const uu = (u - p.cut) / (1 - p.cut);
  o.a = Math.pow(uu, 1.3) * p.glow;
  o.c = rampChar(uu * 0.92);
  o.col = pickCol(uu, p.hue, p.heat, gx, gy);
}
KERN.void = kVoid; KERN.foam = kFoam; KERN.sing = kSing;
KERN.bang = kBang; KERN.plasma = kPlasma; KERN.nebula = kPlasma; KERN.starbg = kPlasma;

/* ============================================================
   NARRATION — massive pixel-font block text that assembles,
   glitches, melts, and is blown away by cosmic winds.
   ============================================================ */
const TXT = [];
function spawnText(spec, T) {
  const str = spec.txt;
  let cols = 0;
  for (const ch of str) cols += (F5[ch] ? 6 : 4);
  cols -= 1;
  let k = Math.min(W * 0.9 / cols, H * 0.16) * (spec.ts || 1);
  k = Math.min(k, 34);
  const px0 = (W - cols * k) / 2;
  const py0 = H * (spec.y || 0.5) - 3.5 * k;
  const parts = [];
  let cx = 0, idx = 0;
  for (const ch of str) {
    const g = F5[ch];
    if (g) {
      for (let r = 0; r < 7; r++) {
        const row = g[r];
        for (let c = 0; c < 5; c++) {
          if (row.charCodeAt(c) === 49) {
            parts.push({
              x: px0 + (cx + c) * k, y: py0 + r * k,
              sx: (h3(idx, 7, 1) - 0.5) * 200, sy: (h3(idx, 3, 9) - 0.5) * 200,
              fr: r / 6, rf: h3(idx, 11, 4), i: idx
            });
            idx++;
          }
        }
      }
      cx += 6;
    } else cx += 4;
  }
  TXT.push({ spec, parts, born: T, dur: Math.max(1.9, Math.min(spec.d * 0.78, 4.4)), k });
}
function windVec(m, x, y) {
  switch (m) {
    case 'up': return [0.15, -1];
    case 'down': return [0, 0.7];
    case 'right': return [1, -0.15];
    case 'out': { const dx = (x - W / 2) / H, dy = (y - H / 2) / H, l = Math.hypot(dx, dy) + 1e-3; return [dx / l * 1.3, dy / l * 1.3]; }
    case 'in': { const dx = (W / 2 - x) / H, dy = (H / 2 - y) / H, l = Math.hypot(dx, dy) + 1e-3; return [dx / l * 1.6, dy / l * 1.6]; }
    default: return [0.04, -0.04];
  }
}
function drawTexts(t) {
  for (let gi = TXT.length - 1; gi >= 0; gi--) {
    const G = TXT[gi];
    const lt = t - G.born;
    if (lt > G.dur) { TXT.splice(gi, 1); continue; }
    const pr = lt / G.dur;
    const ein = ss01(Math.min(1, lt / (G.dur * 0.14)));
    const mp = clamp01((pr - 0.62) / 0.32);
    const asmb = 1 - ein;
    const tq = (t * 22) | 0;
    const push = 1 + 0.07 * pr;
    const cxS = W / 2, cyS = H * (G.spec.y || 0.5);
    const sz = G.k * 1.62;
    const c1i = PI[G.spec.c1], c2i = PI[G.spec.c2], mci = PI[G.spec.mc];
    const jit = G.spec.jit || 0.12;
    const split = jit > 0.21 && mp <= 0.02;
    for (let pi = 0; pi < G.parts.length; pi++) {
      const p = G.parts[pi];
      let x = p.x + p.sx * asmb, y = p.y + p.sy * asmb;
      const fl = 1 - mp;
      x += Math.sin(t * 1.7 + p.rf * 40) * 1.2 * fl * G.k * 0.09;
      y += Math.cos(t * 1.3 + p.rf * 31) * 1.1 * fl * G.k * 0.08;
      if (h3(p.i, tq, gi * 131) < jit * 0.5) x += (h3(p.i, tq, 17) - 0.5) * G.k * 3.2;
      if (mp > 0) {
        const wv = windVec(G.spec.wp, x, y);
        const e = mp * mp;
        x += wv[0] * e * G.k * 7 + Math.sin(t * 3 + p.rf * 50) * G.k * mp;

      x = cxS + (x - cxS) * push;
      y = cyS + (y - cyS) * push;

        const dg = clamp01(mp * 1.4 - p.rf * 0.5);

      }
      let a = (0.25 + 0.75 * ein) * (mp > 0 ? Math.pow(1 - mp, 1.5) : 1);
      a *= 0.92 + 0.08 * Math.sin(t * 13 + p.rf * 20);
      if (a < 0.03) continue;
      let col = p.rf < p.fr ? c2i : c1i;
      if (mp > 0.35 && h3(p.i, 5, gi) < (mp - 0.35) * 1.4) col = mci;
      ctx.globalAlpha = a;
      ctx.drawImage(S[col][chi], x - sz * 0.15, y - sz * 0.15, sz, sz);
      if (split) {
        const oc = p.i % 2 === 0 ? PI.cyn : PI.pnk;

        ctx.drawImage(S[oc][chi], x - sz * 0.15 - G.k * 0.7, y - sz * 0.15, sz, sz);
      }
    }
  }

/* ---------------- master clock / ignition ---------------- */

/* ---------------- adaptive quality ---------------- */
let ema = 16.7, fcheck = 0;
function adapt(dt) {
  ema = ema * 0.95 + dt * 1000 * 0.05;
  fcheck += dt;
  if (fcheck > 3) {
    fcheck = 0;
    if (ema > 26 && cellScale < 2.2) { cellScale += 0.3; rebuildGrid(); }
    else if (ema < 14 && cellScale > 1) { cellScale = Math.max(1, cellScale - 0.15); rebuildGrid(); }
  }
}

/* ---------------- main render loop ---------------- */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  adapt(dt);
  if (!running) return;
  const T = clock();
  const p = seq(T);
  /* fire scheduled events */
  while (evp < EV.length && EV[evp].t <= T) {
    const e = EV[evp++];
    if (e.k === 'txt') spawnText(e.s, T);
    else { if (e.p > FPOW) { FPOW = e.p; FCI = e.c; } }
  }
  /* clear with motion trails */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,' + clamp01(p.trail).toFixed(3) + ')';
  ctx.fillRect(0, 0, W, H);
  /* screen shake */
  const shx = (h3(p.fq, 1, 3) - 0.5) * (p.shake * 3 + FPOW * 9);
  const shy = (h3(p.fq, 2, 5) - 0.5) * (p.shake * 3 + FPOW * 9);
  ctx.save();
  ctx.translate(shx, shy);
  ctx.globalCompositeOperation = 'lighter';
  /* ---- the ASCII field ---- */
  const exposure = p.exposure * (1 + p.strobe * (h3(p.fq, 7, 3) - 0.5) * 0.9);
  const fA = p.fnA, fB = p.fnB, mixw = p.mix;
  for (let gy = 0; gy < GY; gy++) {
    const ny = nyA[gy];
    const py = gy * CELL;
    for (let gx = 0; gx < GX; gx++) {
      const nx = nxA[gx];
      if (mixw >= 1) {
        fA(nx, ny, gx, gy, T, p, OA);
      } else {
        fA(nx, ny, gx, gy, T, p, OA);
        fB(nx, ny, gx, gy, T, p, OB);
        const wa = mixw, wb = 1 - mixw;
        if (OB.a * wb > OA.a * wa) { OA.c = OB.c; OA.col = OB.col; }
        OA.a = OA.a * wa + OB.a * wb;
        OA.m = OA.m || OB.m;
      }
      const a = OA.a * exposure;
      if (a <= 0.025) continue;
      const px = gx * CELL;
      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.drawImage(S[OA.col][OA.c], px - POF, py - POF, DS, DS);
      if (OA.m) {
        ctx.globalAlpha = a * 0.5;
        ctx.drawImage(S[OA.col][oppChar(OA.c)], (GX - 1 - gx) * CELL - POF, (GY - 1 - gy) * CELL - POF, DS, DS);
      }
    }
  }
  /* ---- overlays ---- */
  drawSparks(p, T);
  drawAtoms(p, T);
  drawStars(p, T);
  drawStellar(p, T);
  drawTexts(T);
  ctx.restore();
  /* ---- ignition flashes ---- */
  if (FPOW > 0.012) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = FPOW * 0.85;
    ctx.fillStyle = FILL[FCI];
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  FPOW *= Math.exp(-dt * 3.6);
}
requestAnimationFrame(frame);
</script>
