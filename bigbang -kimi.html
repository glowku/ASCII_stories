}

  const c = hexRGB(h);

}

  const c1 = hexRGB(h1), c2 = hexRGB(h2);

  comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.25;
  master.connect(comp); comp.connect(AC.destination);
  dryBus = AC.createGain(); dryBus.gain.value = 0.85; dryBus.connect(master);
  reverb = AC.createConvolver(); reverb.buffer = makeIR(4.2, 2.6);
  wetBus = AC.createGain(); wetBus.gain.value = 0.42; reverb.connect(wetBus); wetBus.connect(master);
  noiseIR = makeIR(2.2, 1.2); windBuf = pinkBuffer(4.0);
  droneFilter = AC.createBiquadFilter(); droneFilter.type = 'lowpass'; droneFilter.frequency.value = 320; droneFilter.Q.value = 0.7;
  droneGain = AC.createGain(); droneGain.gain.value = 0.0;
  droneFilter.connect(droneGain); send(droneGain);
  const ch0 = chordFor(0);
  for (let i = 0; i < 4; i++) {
    const o = AC.createOscillator(); o.type = i === 0 ? 'sine' : i === 3 ? 'triangle' : 'sawtooth';
    o.frequency.value = ch0[i] || 55;
    const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = (ch0[i] || 55) * 1.006;
    const g = AC.createGain(); g.gain.value = i === 3 ? 0.12 : 0.22;
    o.connect(g); o2.connect(g); g.connect(droneFilter);
    o.start(); o2.start();
    droneOscs.push({ o, o2, base: ch0[i] || 55 });
  }
  subOsc = AC.createOscillator(); subOsc.type = 'sine'; subOsc.frequency.value = 32;
  subGain = AC.createGain(); subGain.gain.value = 0.0;
  subOsc.connect(subGain); subGain.connect(master); subGain.connect(reverb); subOsc.start();
  windSrc = AC.createBufferSource(); windSrc.buffer = windBuf; windSrc.loop = true;
  windBP = AC.createBiquadFilter(); windBP.type = 'bandpass'; windBP.frequency.value = 500; windBP.Q.value = 0.8;
  windGain = AC.createGain(); windGain.gain.value = 0.0;
  windSrc.connect(windBP); windBP.connect(windGain); send(windGain); windSrc.start();
  audioReady = true;
  master.gain.linearRampToValueAtTime(0.9, AC.currentTime + 2.5);
}
function setChord(i) {
  if (!audioReady) return;
  const ch = chordFor(i), now = AC.currentTime;
  droneOscs.forEach((d, k) => {
    const f = ch[k] || d.base;
    d.o.frequency.linearRampToValueAtTime(f, now + 3.0);
    d.o2.frequency.linearRampToValueAtTime(f * 1.006, now + 3.0);
  });
}
function boom(power) {
  if (!audioReady) return; const t0 = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine'; const g = AC.createGain();
  o.frequency.setValueAtTime(140 * power, t0); o.frequency.exponentialRampToValueAtTime(26, t0 + 1.3);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.95 * power, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
  o.connect(g); g.connect(master); g.connect(reverb); o.start(t0); o.stop(t0 + 2.5);
  const n = AC.createBufferSource(); n.buffer = noiseIR;
  const nf = AC.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.setValueAtTime(5000 * power, t0); nf.frequency.exponentialRampToValueAtTime(180, t0 + 1.5);
  const ng = AC.createGain(); ng.gain.setValueAtTime(0.7 * power, t0); ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
  n.connect(nf); nf.connect(ng); send(ng); n.start(t0); n.stop(t0 + 2.0);
}
function riser(dur) {
  if (!audioReady) return; const t0 = AC.currentTime;
  const n = AC.createBufferSource(); n.buffer = windBuf; n.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4;
  bp.frequency.setValueAtTime(180, t0); bp.frequency.exponentialRampToValueAtTime(4500, t0 + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.34, t0 + dur * 0.92); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.3);
  n.connect(bp); bp.connect(g); send(g); n.start(t0); n.stop(t0 + dur + 0.4);
  const o = AC.createOscillator(); o.type = 'sawtooth';
  const of = AC.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 1400;
  const og = AC.createGain(); og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.09, t0 + dur * 0.92); og.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.3);
  o.frequency.setValueAtTime(55, t0); o.frequency.exponentialRampToValueAtTime(660, t0 + dur);
  o.connect(of); of.connect(og); send(og); o.start(t0); o.stop(t0 + dur + 0.4);
}
function whoosh() {
  if (!audioReady) return; const t0 = AC.currentTime;
  const n = AC.createBufferSource(); n.buffer = windBuf; n.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1;
  bp.frequency.setValueAtTime(1800, t0); bp.frequency.exponentialRampToValueAtTime(280, t0 + 1.6);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.7);
  n.connect(bp); bp.connect(g); send(g); n.start(t0); n.stop(t0 + 1.8);
}
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17];
function shimmer(count, intensity) {
  if (!audioReady) return; const t0 = AC.currentTime;
  for (let i = 0; i < count; i++) {
    const f = 523.25 * Math.pow(2, PENTA[(Math.random() * PENTA.length) | 0] / 12);
    const ot = t0 + Math.random() * 0.7;
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, ot);
    g.gain.exponentialRampToValueAtTime(0.11 * intensity, ot + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ot + 0.9 + Math.random() * 0.9);
    o.connect(g); send(g); o.start(ot); o.stop(ot + 2.0);
  }
}
function chordPad(freqs, dur) {
  if (!audioReady) return; const t0 = AC.currentTime;
  freqs.forEach((f, i) => {
    const o = AC.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = f;
    const o2 = AC.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = f * 1.005;
    const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 1600;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.1, t0 + 0.5); g.gain.setValueAtTime(0.1, t0 + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); o2.connect(g); g.connect(fl); send(fl);
    o.start(t0); o2.start(t0); o.stop(t0 + dur + 0.2); o2.stop(t0 + dur + 0.2);
  });
}
function dawnBurst() {
  if (!audioReady) return;
  const t0 = AC.currentTime;
  chordPad([65.41, 98.00, 130.81, 196.00], 6.4);
  shimmer(20, 1.05);
  const n = AC.createBufferSource(); n.buffer = windBuf; n.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.5;
  const g = AC.createGain();
  bp.frequency.setValueAtTime(420, t0); bp.frequency.exponentialRampToValueAtTime(5200, t0 + 2.8); bp.frequency.exponentialRampToValueAtTime(1300, t0 + 5.8);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.22, t0 + 1.1); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 6.0);
  n.connect(bp); bp.connect(g); send(g); n.start(t0); n.stop(t0 + 6.1);
}
function updateAudio(T, p) {
  if (!audioReady) return; const now = AC.currentTime;
  droneFilter.frequency.linearRampToValueAtTime(200 + p.heat * 700 + p.glow * 320, now + 0.15);
  droneGain.gain.linearRampToValueAtTime(0.06 + p.glow * 0.06, now + 0.2);
  subOsc.frequency.linearRampToValueAtTime(28 + p.heat * 12, now + 0.2);
  subGain.gain.linearRampToValueAtTime(0.04 + p.heat * 0.14 + p.shake * 0.12, now + 0.2);
  windBP.frequency.linearRampToValueAtTime(300 + p.heat * 900 + p.speed * 500, now + 0.3);
  windGain.gain.linearRampToValueAtTime(0.012 + p.speed * 0.05 + p.grain * 0.04, now + 0.3);
  if (p.stars > 0.5 && Math.random() < 0.03) shimmer(1, 0.5 * p.stars);
}
function onSceneEnter(i) {
  setChord(i);
  switch (i) {
    case 5: break;
    case 8: riser(4.5); break;
    case 9: riser(5.5); break;
    case 10: boom(0.75); camPunch = -0.35; break;
    case 11: boom(1.3); whoosh(); camPunch = -0.75; ripple(clock(), W / 2, H / 2, PI.wht, 1.5, 0.1); break;
    case 12: whoosh(); camPunch = -0.45; break;
    case 16: whoosh(); break;
    case 28: shimmer(9, 0.8); break;
    case 29: dawnBurst(); break;
    case 30: shimmer(14, 0.95); break;
    case 32: shimmer(6, 0.6); break;
    case 39: riser(4.0); break;
    case 40: chordPad(chordFor(40), 6); boom(0.8); camPunch = -0.55; break;
  }
}

/* ---------------- master clock / ignition ---------------- */
let running = false, startT = 0;
function clock() { return performance.now() * 0.001 - startT; }
function ignite() {
  if (!running) {
    running = true; startT = performance.now() * 0.001;
    initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  } else {
    if (AC && AC.state === 'suspended') AC.resume();
    if (clock() > END + 6) { startT = performance.now() * 0.001; evp = 0; TXT.length = 0; SI = 0; FPOW = 0; RIP.length = 0; lastPulse = 0; camPunch = 0; lastScene = -1; camCurrent = 1; camTarget = 1; }
  }
}
window.addEventListener('pointerdown', ignite);
window.addEventListener('keydown', ignite);

/* ---------------- adaptive quality ---------------- */
let ema = 16.7, fcheck = 0;
function adapt(dt) {
  ema = ema * 0.95 + dt * 1000 * 0.05; fcheck += dt;
  if (fcheck > 3) { fcheck = 0;
    if (ema > 28 && cellScale < 2.2) { cellScale += 0.3; rebuildGrid(); }
    else if (ema < 13 && cellScale > 1) { cellScale = Math.max(1, cellScale - 0.15); rebuildGrid(); }
  }
}

/* ---------------- main loop ---------------- */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000; last = now; if (dt > 0.05) dt = 0.05;
  adapt(dt);
  if (!running) return;
  const T = clock();
  const p = seq(T);
  if (SI !== lastScene) { lastScene = SI; onSceneEnter(SI); }
  updateAudio(T, p);
  while (evp < EV.length && EV[evp].t <= T) {
    const e = EV[evp++];
    if (e.k === 'txt') spawnText(e.s, T);
    else { if (e.p > FPOW) { FPOW = e.p; FCI = e.c; } ripple(T, W / 2, H / 2, e.c, e.p > 0.7 ? 1.4 : 0.8, e.p > 0.7 ? 0.09 : 0.05); }
  }
  if (p.heat > 1.2 && p.stellar < 0.2) { if (T - lastPulse > 1.1) { lastPulse = T; ripple(T, W / 2, H / 2, pickCol(0.8, p.hue, p.heat, 0, 0), 0.55, 0.04); } }
  const treat = cinematicTreatment(T);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,' + clamp01(p.trail).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);

  /* CAMERA: smooth interpolation + dramatic pullback */
  camPunch *= Math.exp(-dt * 2.15);
  const textActive = TXT.length > 0;
  const textZoom = textActive ? 0.9 : 1.0;
  const targetCam = Math.max(0.62, (p.cam + (p.camPull || 0)) * textZoom);
  camTarget += (targetCam - camTarget) * 0.028;
  camCurrent += (camTarget - camCurrent) * 0.045;
  const camS = camCurrent * (1 + 0.018 * Math.sin(T * 0.25)) + camPunch;
  const shx = (h3(p.fq, 1, 3) - 0.5) * (p.shake * 4 + FPOW * 12);
  const shy = (h3(p.fq, 2, 5) - 0.5) * (p.shake * 4 + FPOW * 12);
  ctx.save();
  ctx.translate(W / 2 + shx + Math.sin(T * 0.19) * CELL * 0.45, H / 2 + shy + Math.cos(T * 0.16) * CELL * 0.32);
  ctx.scale(camS, camS);
  ctx.translate(-W / 2, -H / 2);
  ctx.globalCompositeOperation = 'lighter';

  const exposure = p.exposure * (1 + p.strobe * (h3(p.fq, 7, 3) - 0.5) * 0.9);
  const fA = p.fnA, fB = p.fnB, mixw = p.mix;
  for (let gy = 0; gy < GY; gy++) {
    const ny = nyA[gy], py = gy * CELL;
    for (let gx = 0; gx < GX; gx++) {
      const nx = nxA[gx];
      if (mixw >= 1) { fA(nx, ny, gx, gy, T, p, OA); }
      else {
        fA(nx, ny, gx, gy, T, p, OA); fB(nx, ny, gx, gy, T, p, OB);
        const wa = mixw, wb = 1 - mixw;
        if (OB.a * wb > OA.a * wa) { OA.c = OB.c; OA.col = OB.col; }
        OA.a = OA.a * wa + OB.a * wb; OA.m = OA.m || OB.m;
      }
      const a = OA.a * exposure; if (a <= 0.025) continue;
      const px = gx * CELL;
      ctx.globalAlpha = a > 1 ? 1 : a;
      ctx.drawImage(S[OA.col][OA.c], px - POF, py - POF, DS, DS);
      if (OA.m) { ctx.globalAlpha = a * 0.5; ctx.drawImage(S[OA.col][oppChar(OA.c)], (GX - 1 - gx) * CELL - POF, (GY - 1 - gy) * CELL - POF, DS, DS); }
    }
  }
  drawRipples(T); drawArcs(p, T); drawSparks(p, T); drawDust(p, T);
  drawVortex(p, T); drawAtoms(p, T); drawStars(p, T); drawStellar(p, T); drawLightBirth(p, T);
  ctx.restore();

  if (FPOW > 0.012) {
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = FPOW * 0.85;
    ctx.fillStyle = FILL[FCI]; ctx.fillRect(0, 0, W, H);
  }
  /* Text rendered AFTER camera restore — always crisp, centered horizontally, top/bottom vertically */
  drawTexts(T);
  applyCinematicTreatment(treat);
  FPOW *= Math.exp(-dt * 3.6);
}
requestAnimationFrame(frame);
</script>
