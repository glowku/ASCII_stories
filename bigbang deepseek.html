    const pulse = 1 + 0.06*Math.sin(t*5.1) + (p.spulse?0.22*Math.sin(t*2.3)*p.spulse:0);
    const R = CELL*(1.4+2.6*st)*pulse;
    ctx.globalAlpha = Math.min(1, st*1.3);
    ctx.drawImage(S[PI.wht][CI['@']], px-R*0.92, py-R*0.92, R*1.84, R*1.84);
    ctx.globalAlpha = 0.4*st;
    ctx.drawImage(S[PI.gld][CI['O']], px-R*1.5, py-R*1.5, R*3, R*3);
    const rq = (t*3)|0;
    for (let i=0;i<24;i++) {
      const an = i/24*TAU + 0.1*Math.sin(t*0.7);
      const rr = R*(2.2+0.7*h3(i,rq,5));
      const a = 0.6*st*(0.4+0.6*h3(i,rq,9));
      if(a<0.05)continue;
      ctx.globalAlpha=a;
      ctx.drawImage(S[h3(i,rq,3)<0.5?PI.gld:PI.crm][i%2?CI['·']:CI['°']], px+Math.cos(an)*rr-DS*0.35, py+Math.sin(an)*rr-DS*0.35, DS*0.7, DS*0.7);
    }
  }

  /* ============================================================
     NARRATION — massive pixel-font text with multiple lines
     ============================================================ */
  const TXT = [];
  function spawnText(scene, T) {
    const allPhrases = scene.txt;
    scene._curPhrase = 0;
    scene._phraseTimer = 0;
    scene._phraseDuration = scene.d / allPhrases.length;
    TXT.push({ scene, parts: [], born: T, dur: scene.d, k: 1 });
    buildTextParts(scene, 0);
  }
  function buildTextParts(scene, idx) {
    if (idx >= scene.txt.length) return;
    const str = scene.txt[idx];
    let cols = 0;
    for (const ch of str) cols += (F5[ch] ? 6 : 4);
    cols -= 1;
    let k = Math.min(W * 0.9 / cols, H * 0.15) * (scene.ts || 1);
    k = Math.min(k, 36);
    const px0 = (W - cols * k) / 2;
    const py0 = H * (scene.y || 0.5) - 3.5 * k;
    const parts = [];
    let cx = 0, pidx = 0;
    for (const ch of str) {
      const g = F5[ch];
      if (g) {
        for (let r = 0; r < 7; r++) {
          const row = g[r];
          for (let c = 0; c < 5; c++) {
            if (row.charCodeAt(c) === 49) {
              parts.push({
                x: px0 + (cx + c) * k, y: py0 + r * k,
                sx: (h3(pidx, 7, 1) - 0.5) * 200, sy: (h3(pidx, 3, 9) - 0.5) * 200,
                fr: r / 6, rf: h3(pidx, 11, 4), i: pidx
              });
              pidx++;
            }
          }
        }
        cx += 6;
      } else cx += 4;
    }
    scene._parts = parts;
    scene._k = k;
    scene._partAge = 0;
  }
  function windVec(m, x, y) {
    switch (m) {
      case 'up': return [0.15, -1];
      case 'down': return [0, 0.7];
      case 'right': return [1, -0.15];
      case 'out': { const dx = (x-W/2)/H, dy = (y-H/2)/H, l = Math.hypot(dx,dy)+1e-3; return [dx/l*1.3, dy/l*1.3]; }
      case 'in': { const dx = (W/2-x)/H, dy = (H/2-y)/H, l = Math.hypot(dx,dy)+1e-3; return [dx/l*1.6, dy/l*1.6]; }
      default: return [0.04, -0.04];
    }
  }
  function drawTexts(t) {
    for (let gi = TXT.length - 1; gi >= 0; gi--) {
      const G = TXT[gi];
      const scene = G.scene;
      const lt = t - G.born;
      if (lt > G.dur) { TXT.splice(gi, 1); continue; }
      // switch phrase?
      if (scene._curPhrase < scene.txt.length - 1) {
        const nextTime = (scene._curPhrase + 1) * scene._phraseDuration;
        if (lt >= nextTime) {
          scene._curPhrase++;
          buildTextParts(scene, scene._curPhrase);
        }
      }
      const parts = scene._parts;
      if (!parts) continue;
      const phraseStart = scene._curPhrase * scene._phraseDuration;
      const phraseAge = lt - phraseStart;
      const phraseDur = scene._phraseDuration;
      const ein = ss01(Math.min(1, phraseAge / (phraseDur * 0.18)));
      const mp = clamp01((phraseAge/phraseDur - 0.6) / 0.4);
      const asmb = 1 - ein;
      const tq = (t * 22) | 0;
      const push = 1 + 0.07 * (phraseAge/phraseDur);
      const cxS = W/2, cyS = H*(scene.y||0.5);
      const sz = scene._k * 1.62;
      const c1i = PI[scene.c1], c2i = PI[scene.c2], mci = PI[scene.mc];
      const jit = scene.jit || 0.12;
      for (let pi = 0; pi < parts.length; pi++) {
        const p = parts[pi];
        let x = p.x + p.sx * asmb, y = p.y + p.sy * asmb;
        const fl = 1 - mp;
        x += Math.sin(t*1.7 + p.rf*40)*1.2*fl*scene._k*0.09;
        y += Math.cos(t*1.3 + p.rf*31)*1.1*fl*scene._k*0.08;
        if (h3(p.i, tq, gi*131) < jit*0.5) x += (h3(p.i, tq, 17)-0.5)*scene._k*3.2;
        if (mp > 0) {
          const wv = windVec(scene.wp, x, y);
          const e = mp*mp;
          x += wv[0]*e*scene._k*7 + Math.sin(t*3 + p.rf*50)*scene._k*mp;
          y += wv[1]*e*scene._k*7;
        }
        x = cxS + (x-cxS)*push;
        y = cyS + (y-cyS)*push;
        let chi = CI['█'];
        if (mp > 0) {
          const dg = clamp01(mp*1.4 - p.rf*0.5);
          chi = dg>0.75?CI['░']:dg>0.5?CI['▒']:dg>0.25?CI['▓']:CI['█'];
        }
        let a = (0.25+0.75*ein) * (mp>0?Math.pow(1-mp,1.5):1);
        a *= 0.92+0.08*Math.sin(t*13+p.rf*20);
        if (a<0.03) continue;
        let col = p.rf < p.fr ? c2i : c1i;
        if (mp>0.35 && h3(p.i,5,gi)<(mp-0.35)*1.4) col = mci;
        ctx.globalAlpha = a;
        ctx.drawImage(S[col][chi], x-sz*0.15, y-sz*0.15, sz, sz);
      }
    }
  }

  /* ============================================================
     EVENTS & NARRATION TIMER
     ============================================================ */
  const EV = [];
  SC.forEach((s, i) => EV.push({ t: s.t0 + Math.min(0.9, s.d*0.18), k: 'txt', s }));
  const FLASHES = [
    [11,0,'wht',1.0],[12,0,'crm',0.5],[13,0,'amb',0.25],[18,0,'org',0.28],
    [29,0.9,'cyn',0.5],[30,0,'ice',0.4],[31,0.4,'ice',0.42],[40,4.2,'amb',0.35],[41,0,'gld',1.0]
  ];
  FLASHES.forEach(f => EV.push({ t: SC[f[0]-1].t0 + f[1], k: 'fl', c: PI[f[2]], p: f[3] }));
  EV.sort((a,b) => a.t-b.t);
  let evp = 0, FPOW = 0, FCI = PI.wht;

  /* ---------------- AUDIO ENGINE (procedural, immersive) ---------------- */
  let audioCtx = null;
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(audioCtx.destination);
    return { ctx: audioCtx, master: masterGain };
  }
  let audioNodes = { drone: null, bass: null, noise: null, events: [] };
  function updateAudio(T, p) {
    if (!audioCtx) return;
    const ctx = audioCtx;
    // Drone: low frequency hum modulated by cosmic parameters
    if (!audioNodes.drone) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 55;
      gain.gain.value = 0.03;
      osc.connect(gain);
      gain.connect(audioNodes.master || ctx.destination);
      osc.start();
      audioNodes.drone = { osc, gain };
    }
    const droneFreq = 40 + 25 * Math.sin(T * 0.1) + p.heat * 15;
    audioNodes.drone.osc.frequency.linearRampToValueAtTime(droneFreq, ctx.currentTime + 0.1);
    audioNodes.drone.gain.gain.linearRampToValueAtTime(0.02 + p.glow * 0.08, ctx.currentTime + 0.1);

    // Bass pulse on big bangs
    if (p.shake > 1.5 && !audioNodes.bass) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 30;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioNodes.master || ctx.destination);
      osc.start();
      audioNodes.bass = { osc, gain, timer: 0 };
    }
    if (audioNodes.bass) {
      audioNodes.bass.timer += 0.016;
      if (audioNodes.bass.timer > 2.0) {
        audioNodes.bass.gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
        audioNodes.bass.osc.stop(ctx.currentTime + 0.4);
        audioNodes.bass = null;
      } else {
        audioNodes.bass.gain.gain.linearRampToValueAtTime(0.3 * Math.exp(-audioNodes.bass.timer*2), ctx.currentTime+0.1);
      }
    }
  }

  /* ---------------- master clock / ignition ---------------- */
  let running = false, startT = 0;
  function clock() { return performance.now() * 0.001 - startT; }
  function ignite() {
    if (!running) {
      running = true;
      startT = performance.now() * 0.001;
      const audio = initAudio();
      if (audio) audioNodes.master = audio.master;
    } else if (clock() > END + 5) {
      startT = performance.now() * 0.001;
      evp = 0; TXT.length = 0; SI = 0; FPOW = 0;
      audioNodes = {};
    }
  }
  window.addEventListener('pointerdown', ignite);
  window.addEventListener('keydown', ignite);
  setTimeout(ignite, 900);

  /* ---------------- adaptive quality ---------------- */
  let ema = 16.7, fcheck = 0;
  function adapt(dt) {
    ema = ema * 0.95 + dt * 1000 * 0.05;
    fcheck += dt;
    if (fcheck > 3) {
      fcheck = 0;
      if (ema > 28 && cellScale < 2.2) { cellScale += 0.3; rebuildGrid(); }
      else if (ema < 13 && cellScale > 1) { cellScale = Math.max(1, cellScale - 0.15); rebuildGrid(); }
    }
  }

  /* ---------------- main render loop ---------------- */
  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    adapt(dt);
    if (!running) return;
    const T = clock();
    const p = seq(T);
    updateAudio(T, p);
    /* fire scheduled events */
    while (evp < EV.length && EV[evp].t <= T) {
      const e = EV[evp++];
      if (e.k === 'txt') spawnText(e.s, T);
      else { if (e.p > FPOW) { FPOW = e.p; FCI = e.c; } }
    }
    /* clear with motion trails */
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,' + clamp01(p.trail).toFixed(3) + ')';
    ctx.fillRect(0,0,W,H);
    /* screen shake */
    const shx = (h3(p.fq,1,3)-0.5)*(p.shake*4 + FPOW*12);
    const shy = (h3(p.fq,2,5)-0.5)*(p.shake*4 + FPOW*12);
    ctx.save();
    ctx.translate(shx, shy);
    ctx.globalCompositeOperation = 'lighter';
    /* ---- ASCII field ---- */
    const exposure = p.exposure * (1 + p.strobe * (h3(p.fq,7,3)-0.5)*0.9);
    const fA = p.fnA, fB = p.fnB, mixw = p.mix;
    for (let gy=0; gy<GY; gy++) {
      const ny = nyA[gy], py = gy*CELL;
      for (let gx=0; gx<GX; gx++) {
        const nx = nxA[gx];
        if (mixw>=1) { fA(nx,ny,gx,gy,T,p,OA); }
        else {
          fA(nx,ny,gx,gy,T,p,OA);
          fB(nx,ny,gx,gy,T,p,OB);
          const wa=mixw, wb=1-mixw;
          if(OB.a*wb > OA.a*wa){ OA.c=OB.c; OA.col=OB.col; }
          OA.a = OA.a*wa + OB.a*wb;
          OA.m = OA.m || OB.m;
        }
        const a = OA.a * exposure;
        if(a<=0.025)continue;
        const px = gx*CELL;
        ctx.globalAlpha = a>1?1:a;
        ctx.drawImage(S[OA.col][OA.c], px-POF, py-POF, DS, DS);
        if(OA.m){
          ctx.globalAlpha = a*0.5;
          ctx.drawImage(S[OA.col][oppChar(OA.c)], (GX-1-gx)*CELL-POF, (GY-1-gy)*CELL-POF, DS, DS);
        }
      }
    }
    drawFilaments(p, T);
    drawSparks(p, T);
    drawAtoms(p, T);
    drawStars(p, T);
    drawStellar(p, T);
    drawTexts(T);
    ctx.restore();
    /* ignition flashes */
    if(FPOW>0.012){
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=FPOW*0.85;
      ctx.fillStyle=FILL[FCI];
      ctx.fillRect(0,0,W,H);
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    FPOW *= Math.exp(-dt*3.6);
  }
  requestAnimationFrame(frame);
</script>
</body>
