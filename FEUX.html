const KERN = {};
let END = 0;
function phraseUnits(str) {
  let units = 0;
  for (const ch of str) units += F5[ch] ? 6 : 4;
  return Math.max(1, units - 1);
}
function makeNarrativePages(lines) {
  const pages = [];
  for (let i = 0; i < lines.length;) {
    const page = [lines[i++]];
    if (i < lines.length && page[0].length + lines[i].length <= 46) page.push(lines[i++]);
    pages.push(page);
  }
  return pages;
}
function readingTime(page) {
  const longest = Math.max(...page.map(line => line.length));
  return Math.max(2.4, Math.min(3.8, 1.25 + longest * 0.05 + page.length * 0.36));
}
(function prep() {
  let acc = 0;
  SC.forEach((s, i) => {
    s.pages = makeNarrativePages(s.txt);
    s.pageDurations = s.pages.map(readingTime);
    s.pageStarts = [];
    let narrationTime = 0.3;
    s.pageDurations.forEach(d => { s.pageStarts.push(narrationTime); narrationTime += d; });
    s.outro = 0.8;
    s.d = Math.max(s.d, narrationTime + s.outro);
    const bottomForced = (i >= 14 && i <= 17) || i >= 32;
    s.y = (bottomForced || i % 2 === 1) ? 0.845 : 0.155;
    s.t0 = acc; acc += s.d;
    s.M = Object.assign({}, DEF, s.P); s.fnName = s.k;
  });
  END = acc;
})();

const OA = { a:0, c:0, col:0, m:0 }, OB = { a:0, c:0, col:0, m:0 };

/* kForestBurn : Foret verte qui roussit, devient rouge, puis cendres */
function kForestBurn(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const x = nx * 2;
  const y = ny * 1.5;
  
  // Silhouettes d'arbres
  const trunk = Math.abs(Math.sin(x * 3 + Math.cos(y * 1.5))) * (y < 0.8 ? 1 : 0);
  const canopy = Math.sin(x * 8 + t * 0.5) * Math.cos(y * 5 - t * 0.2) * (y > -0.2 && y < 0.8 ? 1 : 0);
  
  let u = Math.max(trunk * 0.6, canopy * 0.5 + 0.5);
  
  // Effet de combustion qui déchire la matière
  const burn = Math.sin(x * 30 + y * 30 + t * 6) * p.heat;
  u = clamp01(u + burn * 0.3 - p.cut);
  
  if (u < 0.1) return;
  o.a = u * p.glow;
  
  // Transition Green -> Red -> Ash
  if (p.heat < 0.4) { o.col = PI.forest; o.c = CI['█']; }
  else if (p.heat < 0.7) { o.col = h3(gx, gy, 5) < 0.5 ? PI.moss : PI.gold; o.c = CI['▓']; }
  else if (p.heat < 0.9) { o.col = h3(gx, gy, 5) < 0.5 ? PI.fire : PI.ember; o.c = CI['*']; }
  else { o.col = PI.ash; o.c = CI['░']; }
}

/* kInferno : L'immensité du feu, mur de flammes qui monte */
function kInferno(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const front = -0.8 + p.age * 0.05;
  const flameFront = front + 0.4 * Math.sin(nx * 4 + t * 2) + 0.2 * Math.cos(nx * 9 - t * 4);
  
  if (ny > flameFront) {
    // Au-dessus du feu : escarbilles et fumée
    if (h3(gx, gy, Math.floor(t*10)) < 0.05 * p.heat) {
      o.a = 0.8 * p.heat; o.col = PI.gold; o.c = CI['^'];
    } else if (p.ash > 0.1 && h3(gx, gy, Math.floor(t*5)) < 0.1) {
      o.a = 0.3 * p.ash; o.col = PI.smoke; o.c = CI['░'];
    }
    return;
  }
  
  // Dans le feu
  const depth = (flameFront - ny);
  const turb = Math.sin(nx * 20 + t * 6) * Math.cos(ny * 15 - t * 8) + Math.sin(nx*30 + t*10) * 0.5;
  let u = clamp01(1.0 - depth * 0.4 + turb * 0.3);
  
  o.a = u * p.glow;
  if (depth > 1.2) o.col = PI.white; // Base très chaude
  else if (depth > 0.8) o.col = PI.gold;
  else if (depth > 0.4) o.col = PI.flame;
  else if (depth > 0.1) o.col = PI.fire;
  else o.col = PI.blood; // Sommet du feu
  
  o.c = u > 0.8 ? CI['█'] : u > 0.5 ? CI['#'] : u > 0.3 ? CI['*'] : CI['.'];
}

/* kFishMath : Poisson mathématique qui bout */
function kFishMath(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const x = nx * 1.5;
  const y = ny * 1.5;
  
  // Équation du poisson (corps + queue)
  const bodyX = x;
  const bodyY = Math.sin(bodyX * 3 + t * 2) * 0.2;
  const distBody = Math.hypot(bodyX * 0.5, (y - bodyY) * 1.5);
  const distTail = Math.hypot((bodyX + 0.8) * 1.5, (y - bodyY) * 2.0);
  
  let u = 0;
  if (distBody < 0.5) u = 1 - distBody * 2;
  else if (distTail < 0.4 && bodyX < 0) u = 1 - distTail * 2.5;
  
  // Vagues de chaleur qui font bouillir la forme
  u *= 0.8 + 0.2 * Math.sin(x * 40 + y * 40 + t * 15);
  u = clamp01(u - p.cut);
  
  if (u < 0.1) return;
  o.a = u * p.glow;
  o.col = p.heat > 0.5 ? PI.blood : PI.ice;
  o.c = u > 0.7 ? CI['█'] : u > 0.4 ? CI['~'] : CI['.'];
}

/* kBirdMath : Ailes brisées tombant */
function kBirdMath(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const x = nx * 1.5;
  const y = ny * 1.5;
  
  const fall = Math.sin(t * 0.5) * 0.5;
  // Ailes brisées calculées par valeur absolue
  const w1 = Math.abs(x) * Math.abs(x) * 2 - 1 + y + fall;
  const w2 = -Math.abs(x) * Math.abs(x) * 2 + 1 + y - fall;
  
  const d = Math.min(Math.abs(w1), Math.abs(w2));
  
  let u = 1.0 - clamp01(d * 8);
  u *= 0.5 + 0.5 * Math.sin(x * 30 + t * 10); // Fragmentation
  u = clamp01(u - p.cut);
  
  if (u < 0.1) return;
  o.a = u * p.glow;
  o.col = PI.ash;
  o.c = x > 0 ? CI['/'] : CI['\\'];
}

/* kSwarmMath : Essaim d'insectes mourant */
function kSwarmMath(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const x = nx * 2;
  const y = ny * 2;
  
  // Champ erratique
  const u = Math.sin(x * 50 + t * 10) * Math.cos(y * 50 - t * 5) + Math.sin((x+y) * 20 + t);
  let val = clamp01(u * 0.5 + 0.5 - p.cut);
  
  if (val < 0.1) return;
  o.a = val * p.glow;
  o.col = PI.bone;
  o.c = CI['.'];
  if (val > 0.8) o.c = CI['*'];
}

/* kVoid : Cendres éparpillées */
function kVoid(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const q = Math.floor(t * (0.6 + p.rate * 2));
  const rr = h3(gx, gy, q);
  if (rr < p.dens * 0.06) {
    o.a = 0.18 + 0.65 * h3(gx, gy, q + 3);
    o.col = h3(gx, gy, q + 5) < 0.8 ? PI.ember : PI.flame;
    o.c = h3(gx, gy, q + 7) < 0.6 ? CI['·'] : CI['.'];
  } else {
    const b = 0.015 * (0.5 + 0.5 * Math.sin(t * 0.6 + ny * 3.2 + nx));
    if (b > 0.005) { o.a = b; o.col = PI.dim; o.c = CI['·']; }
  }
}

/* kSing : Appel / Cœur de fournaise */
function kSing(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const q = Math.floor(t * 20);
  nx += (h3(gx, gy, q) - 0.5) * p.jit * 0.08;
  ny += (h3(gx, gy, q + 1) - 0.5) * p.jit * 0.08;
  const r = Math.hypot(nx, ny) + 1e-5;
  const ang = Math.atan2(ny, nx);
  const fl = h3(gx, gy, q + 2);
  const R0 = 0.15 + 0.02 * Math.sin(t * 6.5);
  const c1 = 0.05 * p.core, c2 = 0.11 * p.core, c3 = 0.2 * p.core;
  const hot = p.heat > 1.0;
  if (r < c3 && c3 > 0.006) {
    if (r < c1) { o.c = CI['@']; o.col = fl < 0.5 ? PI.white : PI.cream; o.a = 1; }
    else if (r < c2) { o.c = fl < 0.5 ? CI['#'] : CI['%']; o.col = hot ? (fl < 0.5 ? PI.gold : PI.blaze) : (fl < 0.5 ? PI.flame : PI.fire); o.a = 0.88; }
    else { o.c = fl < 0.4 ? CI['*'] : CI['%']; o.col = hot ? (fl < 0.5 ? PI.flame : PI.fire) : (fl < 0.5 ? PI.ember : PI.blood); o.a = 0.62; }
    o.a *= 0.75 + 0.25 * fl; return;
  }
  const band = Math.exp(-Math.pow((r - R0) * 13, 2));
  const band2 = Math.exp(-Math.pow((r - R0 * 2 - 0.05) * 5.5, 2)) * (0.55 + 0.45 * Math.sin(ang * 8 - t * 2.5 * p.spin)) * p.spokes;
  const ao = ang - t * (0.45 / (r * 3 + 0.1));
  const db = h3(Math.floor(ao * 26 + 100), Math.floor(r * 24), 31);
  const uu = band + band2 * 0.7 + (db < 0.13 ? 0.5 * (0.3 + 0.7 * db / 0.13) : 0) * Math.exp(-r * 1.3) + Math.exp(-r * 2.2) * 0.1;
  if (uu < 0.045) return;
  o.a = Math.min(1, uu) * p.glow;
  o.col = r < R0 * 1.35 ? (uu > 0.7 ? PI.cream : PI.gold) : (h3(gx, gy, 331) < 0.5 ? PI.fire : PI.ember);
  o.c = rampChar(Math.min(1, uu));
}

/* kBang : Flambées soudaines */
function kBang(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const r = Math.hypot(nx, ny) + 1e-5;
  const ang = Math.atan2(ny, nx) + p.flow * 0.18 * r;
  const R = p.spd * Math.pow(p.age, p.exp);
  const w = p.w;
  const a2 = ((ang % TAU) + TAU) % TAU;
  const sb = 0.45 + 0.55 * h3(Math.floor(a2 * 22), 5, Math.floor(t * 2.5));
  const inside = Math.exp(-r * 2.0 * p.cool) * p.fill;
  let sh = Math.exp(-Math.pow((r - R) / w, 2));
  sh += 0.55 * Math.exp(-Math.pow((r - R * 0.62) / (w * 0.7), 2));
  sh += 0.3 * Math.exp(-Math.pow((r - R * 0.4) / (w * 0.5), 2));
  const shellE = sh * sb * p.streak + sh * 0.3;
  const uu = Math.min(1, inside + shellE);
  if (uu < 0.05) return;
  o.a = uu * p.glow;
  o.col = pickCol(uu, p.hue, p.heat, gx, gy);
  o.c = shellE > inside ? DIRUP[Math.round(a2 / (Math.PI / 4)) % 8] : rampChar(uu * 0.95);
}

/* kPlasma : Mer de flammes / brasiers */
function kPlasma(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const r = Math.hypot(nx, ny) + 1e-4;
  const sw = p.spin * 0.55 / (r + 0.32) + p.flow;
  const cs = Math.cos(sw), sn = Math.sin(sw);
  const x0 = (nx * cs - ny * sn) * p.zoom;
  const y0 = (nx * sn + ny * cs) * p.zoom;
  const T = t * p.speed;
  const wx = Math.sin(y0 * 1.7 + T * 0.9) + Math.sin(y0 * 3.3 - T * 0.5) * 0.5;
  const wy = Math.sin(x0 * 1.9 - T * 0.7) + Math.sin(x0 * 3.1 + T * 0.6) * 0.5 - 0.3 * p.heat;
  const x = x0 + wx * (0.32 + p.spin * 0.4), y = y0 + wy * (0.32 + p.spin * 0.4);
  let v = Math.sin(x * 3.07 + T) + Math.sin(y * 2.71 - T * 1.31)
        + Math.sin((x + y) * 2.33 + T * 0.71) + Math.sin(Math.hypot(x, y) * 4.17 - T * 1.63)
        + Math.sin(x * 6.4 - y * 5.1 + T * 2.2) * 0.5;
  if (p.filaments > 0) v += (Math.sin(x0 * 5.1 + T * 0.3) + Math.cos(y0 * 4.3 - T * 0.4)) * p.filaments * 2.2;
  let u = v * 0.1 + 0.5;
  u += (h3(gx + Math.floor(T * 3), gy, 17) - 0.5) * p.grain * 0.3;
  u = clamp01(u);
  if (u < p.cut) return;
  const uu = (u - p.cut) / (1 - p.cut);
  o.a = Math.pow(uu, 1.3) * p.glow;
  if (uu > 0.55 && p.heat > 1.1 && h3(gx, gy, p.fq >> 3) < 0.32) o.c = DIRUP[(((Math.atan2(wy, wx) * 4 / Math.PI | 0) % 4) + 4) % 4];
  else o.c = rampChar(uu * 0.92);
  o.col = pickCol(uu, p.hue, p.heat, gx, gy);
}

/* kData : Grille froide des data centers */
function kData(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const r = Math.hypot(nx, ny) + 1e-4;
  const sw = p.spin * 0.4 / (r + 0.4) + p.flow;
  const cs = Math.cos(sw), sn = Math.sin(sw);
  const x0 = (nx * cs - ny * sn) * p.zoom;
  const y0 = (nx * sn + ny * cs) * p.zoom;
  const T = t * p.speed;
  const gxv = Math.sin(x0 * 8 + T * 0.5) * 0.5 + 0.5;
  const gyv = Math.sin(y0 * 6 - T * 0.7) * 0.5 + 0.5;
  const scan = Math.sin(y0 * 14 + T * 2.5) * 0.5 + 0.5;
  const pulse = Math.sin(Math.hypot(x0, y0) * 5 - T * 1.5) * 0.5 + 0.5;
  let u = gxv * 0.3 + gyv * 0.25 + scan * 0.25 + pulse * 0.2;
  u += (h3(gx, gy, Math.floor(T * 8)) - 0.5) * p.grain * 0.3;
  u = clamp01(u);
  if (u < p.cut) return;
  const uu = (u - p.cut) / (1 - p.cut);
  o.a = Math.pow(uu, 1.4) * p.glow;
  if (h3(gx, gy, 5) < 0.6) o.col = uu < 0.5 ? PI.steel : PI.ice;
  else if (h3(gx, gy, 7) < 0.7) o.col = PI.cyan;
  else o.col = uu > 0.7 ? PI.white : PI.dim;
  o.c = uu < 0.3 ? CI['·'] : uu < 0.55 ? CI[':'] : uu < 0.78 ? CI['+'] : uu < 0.92 ? CI['#'] : CI['█'];
}

/* kStarbg : Cendres qui montent, la résolution */
function kStarbg(nx, ny, gx, gy, t, p, o) {
  o.a = 0; o.m = 0;
  const r = Math.hypot(nx, ny) + 1e-4;
  const sw = p.spin * 0.4 / (r + 0.32) + p.flow - 0.2;
  const cs = Math.cos(sw), sn = Math.sin(sw);
  const x0 = (nx * cs - ny * sn) * p.zoom;
  const y0 = (nx * sn + ny * cs) * p.zoom;
  const T = t * p.speed;
  const wx = Math.sin(y0 * 1.5 + T * 0.6) * 0.5;
  const wy = -0.4 + Math.sin(x0 * 1.8 + T * 0.4) * 0.3;
  const x = x0 + wx * 0.4, y = y0 + wy * 0.5;
  let v = Math.sin(x * 2.5 + T * 0.5) + Math.sin(y * 2.1 - T * 0.4)
        + Math.sin((x + y) * 1.8 + T * 0.3) * 0.7
        + Math.sin(Math.hypot(x, y) * 3.5 - T * 1.1) * 0.5;
  let u = v * 0.1 + 0.5;
  u += (h3(gx + Math.floor(T * 2), gy, 17) - 0.5) * p.grain * 0.25;
  u = clamp01(u);
  if (u < p.cut) return;
  const uu = (u - p.cut) / (1 - p.cut);
  o.a = Math.pow(uu, 1.4) * p.glow;
  o.col = uu < 0.4 ? PI.ember : uu < 0.7 ? PI.flame : uu < 0.9 ? PI.gold : PI.cream;
  o.c = uu < 0.4 ? CI['·'] : uu < 0.7 ? CI[':'] : uu < 0.9 ? CI['+'] : CI['*'];
}

requestAnimationFrame(frame);
</script>
